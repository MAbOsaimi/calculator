<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>

    <body>
        <div id="calculator">
            <div id="display" contenteditable></div>
            <div id="input-pad">
                <div id="operations-pad">
                    <div id="brackets">
                        <button class="bracket input">(</button>
                        <button class="bracket input">)</button>
                        <button class="bracket input">[</button>
                        <button class="bracket input">]</button>
                    </div>
                    <div id="basic-operations">
                        <button class="basic-operation input" id="add">
                            +
                        </button>
                        <button class="basic-operation input" id="subtract">
                            −
                        </button>
                        <button class="basic-operation input" id="multiply">
                            ×
                        </button>
                        <button class="basic-operation input" id="divide">
                            ÷
                        </button>
                        <button class="basic-operation" id="equal">=</button>
                    </div>
                </div>

                <div id="calculator-operations">
                    <button class="calculator-operation" id="store">
                        Store
                    </button>
                    <button class="calculator-operation" id="delete">
                        Delete
                    </button>
                    <button class="calculator-operation" id="clear">
                        Clear
                    </button>
                </div>
                <div id="numbers-pad">
                    <button class="number input">7</button>
                    <button class="number input">8</button>
                    <button class="number input">9</button>
                    <button class="number input">4</button>
                    <button class="number input">5</button>
                    <button class="number input">6</button>
                    <button class="number input">1</button>
                    <button class="number input">2</button>
                    <button class="number input">3</button>
                    <button class="number input">0</button>
                    <button id="decimal">.</button>
                    <button class="calculator-operation" id="last-answer">
                        Last Answer
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
