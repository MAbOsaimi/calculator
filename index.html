<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>

    <body>
        <div id="calculator">
            <div id="display">1 + 4</div>
            <div id="input-pad">
                <div id="operations-pad">
                    <div id="basic-operations">
                        <button class="basic-operation" id="multiply">×</button>
                        <button class="basic-operation" id="divide">÷</button>
                        <button class="basic-operation" id="add">+</button>
                        <button class="basic-operation" id="subtract">−</button>
                        <button class="basic-operation" id="equal">=</button>
                    </div>
                </div>

                <div id="calculator-operations">
                    <button class="calculator-operation" id="store">
                        Store
                    </button>
                    <button class="calculator-operation" id="delete">
                        Delete
                    </button>
                    <button class="calculator-operation" id="clear">
                        Clear
                    </button>
                </div>
                <div id="numbers-pad">
                    <button class="number">7</button>
                    <button class="number">8</button>
                    <button class="number">9</button>
                    <button class="number">4</button>
                    <button class="number">5</button>
                    <button class="number">6</button>
                    <button class="number">1</button>
                    <button class="number">2</button>
                    <button class="number">3</button>
                    <button class="number">0</button>
                    <button id="decimal">.</button>
                    <button class="calculator-operation" id="last-answer">
                        Last Answer
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
